name: Validate eval cases
jobs:
  validate:
    name: Validate eval cases
    # The wrappers are portable across Linux, macOS, and Git Bash on Windows.
    # `Linux-Small` is accepted by the schema on the nightly server but has no
    # eligible image there, so keep static validation on the live self-hosted
    # pool instead of leaving every push queued indefinitely.
    runs-on: self-hosted
    steps:
      - type: script
        name: Validate cases against schema
        script-content: |-
          :; exec bash evals/run-eval-validation.sh validate
          @goto :windows
          :windows
          @echo off
          "C:\Program Files\Git\bin\bash.exe" evals/run-eval-validation.sh validate
          @if errorlevel 1 exit /b 1
          @exit /b 0
  selfcheck:
    name: Self-check the grader
    runs-on: self-hosted
    steps:
      - type: script
        name: Grade a pipeline of known shape
        script-content: |-
          :; exec bash evals/run-eval-validation.sh selfcheck
          @goto :windows
          :windows
          @echo off
          "C:\Program Files\Git\bin\bash.exe" evals/run-eval-validation.sh selfcheck
          @if errorlevel 1 exit /b 1
          @exit /b 0
  publish_eval_report:
    name: Publish evaluation report
    runs-on: self-hosted
    files-publication:
      - path: .teamcity/evaluation-report/**
        publish-artifact: true
        share-with-jobs: false
    steps:
      - type: script
        name: Collect and render evaluation report
        script-content: |-
          :; exec bash evals/run-eval-report.sh
          @goto :windows
          :windows
          @echo off
          "C:\Program Files\Git\bin\bash.exe" evals/run-eval-report.sh
          @if errorlevel 1 exit /b 1
          @exit /b 0
